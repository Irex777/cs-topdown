<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Voxel Frontline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0e14'/%3E%3Crect x='8' y='8' width='20' height='20' fill='%23c4472f'/%3E%3Crect x='36' y='8' width='20' height='20' fill='%233f7fd8'/%3E%3Crect x='8' y='36' width='20' height='20' fill='%233f7fd8'/%3E%3Crect x='36' y='36' width='20' height='20' fill='%23ffd95a'/%3E%3C/svg%3E">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div class="tk friend"><div class="tk-num" id="scoreF">0</div><div class="tk-bar"><i id="barF"></i></div><div class="tk-name" id="nameF">FRIENDLY</div></div>
    <div class="tk-mid"><div class="tb-time" id="roundTime">0:00</div><div id="flagRow"></div></div>
    <div class="tk enemy"><div class="tk-num" id="scoreE">0</div><div class="tk-bar"><i id="barE"></i></div><div class="tk-name" id="nameE">ENEMY</div></div>
  </div>
  <div class="tb-round" id="roundLabel">Conquest</div>
  <canvas id="compass" width="520" height="34"></canvas>
  <div id="objective" class="hidden"></div>

  <div id="killfeed"></div>
  <div id="scorefeed"></div>
  <div id="banner"></div>
  <div id="prompt"></div>
  <div id="progress" class="hidden"><div id="progressLabel"></div><div class="bar"><i id="progressFill"></i></div></div>

  <div id="left-col">
    <div id="radar-wrap"><canvas id="radar"></canvas></div>
    <div id="squadbox"><div id="mates"></div></div>
  </div>

  <div id="statusbox">
    <div class="vitals">
      <div class="vrow hp"><span class="vic">+</span><div class="vbar"><i id="hpFill"></i></div><b id="hpNum">100</b></div>
      <div class="vrow ar"><span class="vic"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1l6 2v5c0 3.5-2.6 5.8-6 7-3.4-1.2-6-3.5-6-7V3z" fill="currentColor"/></svg></span><div class="vbar"><i id="arFill"></i></div><b id="arNum">0</b></div>
    </div>
    <div id="clsName" class="clsname">ASSAULT</div>
  </div>
  <div id="vehbox" class="hidden"></div>
  <div id="weaponbox">
    <div class="wpanel">
      <div class="wtop"><span id="weaponName">AR-7</span><span id="fireMode">AUTO</span></div>
      <div class="wmid"><img id="weaponImg" alt=""><div id="ammoRow"><span id="clip">30</span><span id="reserve">/ 90</span></div></div>
      <div id="weaponAtt"></div>
    </div>
    <div id="slots"></div>
  </div>

  <div id="chatlog"></div>
  <div id="chatbox" class="hidden"><span id="chatTag">TEAM</span><input id="chatInput" maxlength="160" autocomplete="off" spellcheck="false" aria-label="Chat message"></div>
  <div id="specbar" class="hidden"></div>
  <div id="deathcard" class="hidden"></div>
  <div id="netstat"></div>
</div>

<!-- ================= modals ================= -->
<div id="deploy" class="modal hidden"></div>
<div id="score" class="modal hidden"></div>
<div id="pause" class="modal hidden"></div>
<div id="endgame" class="modal hidden"></div>
<div id="toasts"></div>

<!-- ================= menu screens ================= -->
<section id="home" class="screen"></section>
<section id="lobby" class="screen hidden"></section>
<div id="conn" class="hidden">Connecting to server…</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
