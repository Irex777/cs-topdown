<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Frontline: Voxel Warfare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0e14'/%3E%3Crect x='8' y='8' width='20' height='20' fill='%23c4472f'/%3E%3Crect x='36' y='8' width='20' height='20' fill='%233f7fd8'/%3E%3Crect x='8' y='36' width='20' height='20' fill='%233f7fd8'/%3E%3Crect x='36' y='36' width='20' height='20' fill='%23ffd95a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div class="tb-team t"><div class="tb-score" id="scoreT">0</div><div class="tb-bar"><i id="barT"></i></div><div class="tb-name" id="nameT">CRIMSON</div></div>
    <div class="tb-center"><div class="tb-time" id="roundTime">0:00</div><div id="flagRow"></div><div class="tb-round" id="roundLabel">Conquest</div></div>
    <div class="tb-team ct"><div class="tb-score" id="scoreCT">0</div><div class="tb-bar"><i id="barCT"></i></div><div class="tb-name" id="nameCT">AZURE</div></div>
  </div>
  <div id="objective" class="hidden"></div>

  <div id="left-col">
    <div id="radar-wrap"><canvas id="radar"></canvas></div>
    <div id="mates"></div>
  </div>

  <div id="killfeed"></div>
  <div id="scorefeed"></div>
  <div id="banner"></div>
  <div id="prompt"></div>
  <div id="progress" class="hidden"><div id="progressLabel"></div><div class="bar"><i id="progressFill"></i></div></div>

  <div id="statusbox">
    <div class="hpwrap"><div class="hp-top"><span id="clsName">ASSAULT</span><span id="hpNum">100</span></div><div id="hpBar"></div></div>
  </div>
  <div id="vehbox" class="hidden"></div>
  <div id="weaponbox">
    <div id="ammoRow"><span id="clip">30</span><span id="reserve">/ 90</span></div>
    <div id="weaponName">M416</div>
    <div id="weaponAtt"></div>
    <div id="slots"></div>
  </div>

  <div id="chatlog"></div>
  <div id="chatbox" class="hidden"><span id="chatTag">TEAM</span><input id="chatInput" maxlength="160" autocomplete="off" spellcheck="false" aria-label="Chat message"></div>
  <div id="specbar" class="hidden"></div>
  <div id="deathcard" class="hidden"></div>
  <div id="netstat"></div>
</div>

<!-- ================= modals ================= -->
<div id="deploy" class="modal hidden"></div>
<div id="score" class="modal hidden"></div>
<div id="pause" class="modal hidden"></div>
<div id="endgame" class="modal hidden"></div>
<div id="toasts"></div>

<!-- ================= menu screens ================= -->
<section id="home" class="screen"></section>
<section id="lobby" class="screen hidden"></section>
<div id="conn" class="hidden">Connecting to server…</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
